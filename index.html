<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sky Life CRM</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--gold:#c9a84c;--gold-dark:#9a7530;--gold-dim:#3a2e10;--black:#0d0d0d;--surface:#161616;--surface2:#1f1f1f;--surface3:#2a2a2a;--border:#2e2e2e;--border-gold:rgba(201,168,76,.25);--text:#f0ede8;--text2:#9a9590;--text3:#5a5550;--red:#c94c4c;--red-bg:#2a1010;--amber:#c9954c;--amber-bg:#2a1e0d;--green:#4caa6a;--green-bg:#0d2018;--r:10px}html,body{height:100%;background:var(--black);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px}.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:auto}.header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold)}.logo span{display:block;font-size:9px;letter-spacing:.2em;color:var(--text2);text-transform:uppercase}.vbtn{padding:6px 14px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2)}.vbtn.active{background:var(--gold);border-color:var(--gold);color:var(--black)}.view-toggle{display:flex;gap:6px}.setup-wrap{padding:24px 20px;flex:1;display:flex;flex-direction:column;gap:16px}.setup-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--gold);line-height:1.2}.field{display:flex;flex-direction:column;gap:6px}.label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}.input,select.input{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'Montserrat',sans-serif;font-size:13px;outline:none;-webkit-appearance:none}.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sector-btn{padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:left;line-height:1.3}.sector-btn.s-icon{font-size:18px;display:block;margin-bottom:6px}.sector-btn.selected{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}.btn-primary{width:100%;padding:14px;background:var(--gold);border:none;border-radius:var(--r);color:var(--black);font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 20px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;text-align:center}.stat-n{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;color:var(--gold)}.stat-l{font-size:10px;color:var(--text2);margin-top:4px}.progress-wrap{margin:12px 20px 0}.progress-track{height:3px;background:var(--surface3);border-radius:3px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));transition:width .5s}.progress-pct{font-size:11px;color:var(--text2);margin-top:6px;text-align:right}.section{padding:14px 20px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}.add-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border-gold);background:transparent;color:var(--gold);font-size:11px;cursor:pointer}.task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}.task-card.done{opacity:.55}.task-card.done .task-title{text-decoration:line-through;color:var(--text2)}.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}.check.done{background:var(--green);border-color:var(--green)}.task-body{flex:1}.task-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}.task-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}.prio-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}.prio-tag.alta{background:var(--red-bg);color:#e87070}.prio-tag.media{background:var(--amber-bg);color:#d4a050}.prio-tag.baixa{background:var(--green-bg);color:#5aba7a}.stage-tag{font-size:10px;color:var(--text3)}.time-tag{font-size:10px;color:var(--gold-dark);margin-left:auto}.empty-state{text-align:center;padding:32px 20px;color:var(--text3);font-size:12px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}.overlay.open{opacity:1;pointer-events:all}.modal{background:var(--surface);border:1px solid var(--border-gold);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .3s}.overlay.open .modal{transform:translateY(0)}.modal-handle{width:36px;height:3px;background:var(--border);border-radius:3px;margin:0 auto 16px}.modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);margin-bottom:16px}.modal-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.dash-wrap{padding:14px 20px}.dash-date{font-size:11px;color:var(--text3);margin-bottom:16px}.dash-section{margin-bottom:20px}.dash-title{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}.person-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}.person-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.person-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--gold);font-weight:600;flex-shrink:0}.person-name{font-size:13px;font-weight:500;flex:1}.person-sector{font-size:10px;color:var(--text2)}.taxa-badge{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500}.taxa-badge.high{color:var(--green)}.taxa-badge.mid{color:var(--amber)}.taxa-badge.low{color:var(--red)}.mini-bar-track{height:3px;background:var(--surface3);border-radius:3px;overflow:hidden}.mini-bar-fill{height:100%;border-radius:3px}.mini-bar-fill.high{background:var(--green)}.mini-bar-fill.mid{background:var(--amber)}.mini-bar-fill.low{background:var(--red)}.person-nums{font-size:10px;color:var(--text2);margin-top:5px;text-align:right}.sector-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}.sector-name{font-size:12px;font-weight:500;flex:1}.no-data{text-align:center;padding:40px 20px;color:var(--text3);font-size:12px;line-height:1.7}.refresh-btn{margin:8px auto 0;display:block;padding:8px 20px;border-radius:20px;border:1px solid var(--border-gold);background:transparent;color:var(--gold);font-size:12px;cursor:pointer}.id-bar{margin:16px 20px 0;background:var(--surface);border:1px solid var(--border-gold);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);font-weight:600;flex-shrink:0}.id-info{flex:1}.id-name{font-size:13px;font-weight:500;color:var(--text)}.id-sector{font-size:11px;color:var(--text2);margin-top:2px}.id-date{font-size:11px;color:var(--text3)}</style></head><body><div class="app" id="app"><div class="header"><div class="logo">Sky Life<span>Jeans CRM Diario</span></div><div class="view-toggle" id="vt" style="display:none"><button class="vbtn active" onclick="setView('colaboradora')">Minhas tarefas</button><button class="vbtn" onclick="setView('dashboard')">Painel Joel</button></div></div><div id="mc"></div></div><div class="overlay" id="overlay" onclick="cM(event)"><div class="modal"><div class="modal-handle"></div><div class="modal-title">Nova tarefa</div><div class="modal-fields"><div class="field"><label class="label">Tarefa</label><input class="input" id="mt" placeholder="O que vai fazer?"></div><div class="field"><label class="label">Etapa</label><select class="input" id="me"></select></div><div class="field"><label class="label">Prioridade</label><select class="input" id="mp"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baixa">Baixa</option></select></div><div class="field"><label class="label">Horario</label><input class="input" id="mh" placeholder="Ex: 14h"></div></div><button class="btn-primary" onclick="sT()">Salvar</button></div></div><script>const SU='https://script.google.com/macros/s/AKfycbwP90Zm2EbkxJB5tHO3aQ1khutgJYPvOMi74wIKg9L2OkQxGt6EuOhVIXk2RTuCsEAwCw/exec';const SE={'Marketing':{stages:['A fazer','Producao','Aprovacao','Publicado']},'Eng Produto':{stages:['Desenvolvimento','Aprovacao','Producao','Finalizado']},'SAC Pos-vendas':{stages:['Pendente','Atendendo','Aguardando','Resolvido']},'Supervisora Comercial':{stages:['Planejado','Em andamento','Pend retorno','Concluido']}};let st={view:'setup',user:JSON.parse(localStorage.getItem('slu')||'null'),tasks:[]};let lT=JSON.parse(localStorage.getItem('slt')||'[]');let nid=parseInt(localStorage.getItem('slid')||'1');function sL(){localStorage.setItem('slt',JSON.stringify(lT));localStorage.setItem('slid',nid)}async function api(a,d={}){try{const r=await fetch(SU+'?action='+a+'&'+new URLSearchParams(d));return r.json()}catch(e){return aL(a,d)}}async function aP(a,d){try{const r=await fetch(SU,{method:'POST',body:JSON.stringify({action:a,...d})});return r.json()}catch(e){return aL(a,d)}}function td(){return new Date().toLocaleDateString('pt-BR')}function aL(a,d){if(a==='addTask'){const t={id:'L'+nid++,data:td(),setor:d.setor,colaboradora:d.colaboradora,tarefa:d.tarefa,etapa:d.etapa,prioridade:d.prioridade,horario:d.horario||'',status:'pendente',horaConclusao:''};lT.push(t);sL();return{success:true}}if(a==='updateTask'){const t=lT.find(x=>x.id===d.id);if(t){t.status=d.status;sL()}return{success:true}}if(a==='getTasks')return{tasks:lT.filter(t=>t.data===td()&&(!d.colaboradora||t.colaboradora===d.colaboradora))};if(a==='getDashboard'){const bP={},bS={};lT.filter(t=>t.data===td()).forEach(t=>{const dn=t.status==='concluida';if(!bP[t.colaboradora])bP[t.colaboradora]={setor:t.setor,total:0,concluidas:0};bP[t.colaboradora].total++;if(dn)bP[t.colaboradora].concluidas++;if(!bS[t.setor])bS[t.setor]={total:0,concluidas:0};bS[t.setor].total++;if(dn)bS[t.setor].concluidas++});return{pessoas:Object.entries(bP).map(([n,d])=>({nome:n,setor:d.setor,total:d.total,concluidas:d.concluidas,taxa:d.total>0?Math.round(d.concluidas/d.total*100):0})).sort((a,b)=>b.taxa-a.taxa),setores:Object.entries(bS).map(([n,d])=>({nome:n,total:d.total,concluidas:d.concluidas,taxa:d.total>0?Math.round(d.concluidas/d.total*100):0}))}}}function render(){const c=document.getElementById('mc');const vt=document.getElementById('vt');if(st.view==='setup'){vt.style.display='none';c.innerHTML=rS()}else if(st.view==='colaboradora'){vt.style.display='flex';rC()}else{vt.style.display='flex';rD()}}function rS(){return'<div class="setup-wrap"><div class="setup-title">Bom dia,<br>quem e voce?</div><div class="field"><label class="label">Nome</label><input class="input" id="sn" placeholder="Ex: Ana Paula"></div><div class="field"><label class="label">Setor</label><div class="sector-grid">'+Object.keys(SE).map(k=>'<button class="sector-btn" onclick="selS(''+k+'')" id="sb'+k.replace(/W/g,'')+'">'+k+'</button>').join('')+'</div></div><button class="btn-primary" onclick="doS()">Entrar</button><div style="text-align:center;margin-top:8px"><button onclick="setView('dashboard')" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer">Painel geral</button></div></div>'}let ss='';function selS(s){ss=s;document.querySelectorAll('.sector-btn').forEach(b=>b.classList.remove('selected'));const el=document.getElementById('sb'+s.replace(/W/g,''));if(el)el.classList.add('selected')}function doS(){const n=document.getElementById('sn').value.trim();if(!n||!ss)return alert('Preencha nome e setor');st.user={nome:n,setor:ss};localStorage.setItem('slu',JSON.stringify(st.user));setView('colaboradora')}async function rC(){const u=st.user;const ini=u.nome.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase();const ds=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});const res=await api('getTasks',{colaboradora:u.nome});st.tasks=res.tasks||[];const tot=st.tasks.length;const dn=st.tasks.filter(t=>t.status==='concluida').length;const pct=tot>0?Math.round(dn/tot*100):0;let h='<div class="id-bar"><div class="avatar">'+ini+'</div><div class="id-info"><div class="id-name">'+u.nome+'</div><div class="id-sector">'+u.setor+'</div></div><div class="id-date">'+ds+'</div></div><div class="stats"><div class="stat"><div class="stat-n">'+tot+'</div><div class="stat-l">planejadas</div></div><div class="stat"><div class="stat-n">'+dn+'</div><div class="stat-l">concluidas</div></div><div class="stat"><div class="stat-n">'+pct+'%</div><div class="stat-l">eficiencia</div></div></div><div class="progress-wrap"><div class="progress-track"><div class="progress-bar" style="width:'+pct+'%"></div></div><div class="progress-pct">'+dn+' de '+tot+' hoje</div></div><div class="section"><div class="section-head"><span class="section-title">Tarefas de hoje</span><button class="add-btn" onclick="oM()">+ Add</button></div><div class="task-list">';if(!st.tasks.length){h+='<div class="empty-state">Nenhuma tarefa.<br>Adicione a primeira.</div>'}else{[...st.tasks.filter(t=>t.status!=='concluida'),...st.tasks.filter(t=>t.status==='concluida')].forEach(t=>{const d=t.status==='concluida';h+='<div class="task-card'+(d?' done':'')+'" onclick="togT(''+t.id+'')"><div class="check'+(d?' done':'')+'"></div><div class="task-body"><div class="task-title">'+t.tarefa+'</div><div class="task-meta"><span class="prio-tag '+t.prioridade+'">'+t.prioridade+'</span><span class="stage-tag">'+t.etapa+'</span>'+(t.horario?'<span class="time-tag">'+t.horario+'</span>':'')+'</div></div></div>'})}h+='</div></div>';document.getElementById('mc').innerHTML=h}async function rD(){const ds=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});document.getElementById('mc').innerHTML='<div class="dash-wrap"><div class="dash-date">'+ds+'</div><div id="dc"><div class="no-data">Carregando...</div></div></div>';const r=await api('getDashboard',{});const{pessoas:p=[],setores:s=[]}=r;let h='';if(!p.length){h='<div class="no-data">Nenhuma tarefa hoje ainda.</div>'}else{h+='<div class="dash-section"><div class="dash-title">Por colaboradora</div>';p.forEach(x=>{const ini=x.nome.split(' ').map(a=>a[0]).join('').substring(0,2).toUpperCase();const c=x.taxa>=70?'high':x.taxa>=40?'mid':'low';h+='<div class="person-card"><div class="person-top"><div class="person-avatar">'+ini+'</div><div style="flex:1"><div class="person-name">'+x.nome+'</div><div class="person-sector">'+x.setor+'</div></div><div class="taxa-badge '+c+'">'+x.taxa+'%</div></div><div class="mini-bar-track"><div class="mini-bar-fill '+c+'" style="width:'+x.taxa+'%"></div></div><div class="person-nums">'+x.concluidas+'/'+x.total+' concluidas</div></div>'});h+='</div><div class="dash-section"><div class="dash-title">Por setor</div>';s.forEach(x=>{const c=x.taxa>=70?'high':x.taxa>=40?'mid':'low';h+='<div class="sector-row"><span class="sector-name">'+x.nome+'</span><span style="font-size:10px;color:var(--text3)">'+x.concluidas+'/'+x.total+'</span><span style="font-weight:600;color:var(--'+(c==='high'?'green':c==='mid'?'amber':'red')+')">'+x.taxa+'%</span></div>'});h+='</div>'}h+='<button class="refresh-btn" onclick="setView('dashboard')">Atualizar</button>';document.getElementById('dc').innerHTML=h}function setView(v){st.view=v;document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));const btns=document.querySelectorAll('.vbtn');if(v==='colaboradora'&&btns[0])btns[0].classList.add('active');if(v==='dashboard'&&btns[1])btns[1].classList.add('active');render()}async function togT(id){const t=st.tasks.find(x=>x.id===id);if(!t)return;await aP('updateTask',{id,status:t.status==='concluida'?'pendente':'concluida'});setView('colaboradora')}function oM(){const stages=SE[st.user?.setor]?.stages||[];document.getElementById('me').innerHTML=stages.map(s=>'<option>'+s+'</option>').join('');document.getElementById('mt').value='';document.getElementById('mh').value='';document.getElementById('overlay').classList.add('open')}function cM(e){if(e.target.id==='overlay')document.getElementById('overlay').classList.remove('open')}async function sT(){const t=document.getElementById('mt').value.trim();if(!t)return alert('Digite a tarefa');const u=st.user;await aP('addTask',{setor:u.setor,colaboradora:u.nome,tarefa:t,etapa:document.getElementById('me').value,prioridade:document.getElementById('mp').value,horario:document.getElementById('mh').value});document.getElementById('overlay').classList.remove('open');setView('colaboradora')}if(st.user){st.view='colaboradora';document.getElementById('vt').style.display='flex';render()}else render()</script></body></html>
